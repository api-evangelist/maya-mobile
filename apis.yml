aid: maya-mobile
url: https://raw.githubusercontent.com/api-evangelist/maya-mobile/refs/heads/main/apis.yml
name: Maya Mobile
kind: company
description: Maya Mobile (Mobile Maya Inc) is a US-based global eSIM and connectivity
  platform aggregating 400+ roaming networks across 200+ destinations. Its Connect+
  Connectivity REST API lets resellers and developers provision eSIMs, assign data
  packages, monitor activation status and data usage, suspend or reactivate lines,
  process top-ups, and receive lifecycle events via webhooks.
